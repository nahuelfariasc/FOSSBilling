name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-build-test-pr:
    name: 'PHP Build and Test'
    # Keep PR and push callers separate because job permissions cannot be conditional.
    permissions:
      contents: read
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/php-build-test.yml
    with:
      write-cache: false

  php-build-test-push:
    name: 'PHP Build and Test'
    permissions:
      contents: read
      packages: write
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/php-build-test.yml
    with:
      # Only main writes the shared registry cache, so concurrent branch pushes don't stomp on it.
      write-cache: ${{ github.ref == 'refs/heads/main' }}
