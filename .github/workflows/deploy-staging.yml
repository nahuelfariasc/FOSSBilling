name: Deploy Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Build and Deploy Staging
    runs-on: ubuntu-latest

    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, intl, mbstring, pdo, zlib
          tools: composer

      - name: Install PHP dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate release name
        run: |
          echo "RELEASE=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.STAGING_PORT }} \
            ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".ddev" \
            --exclude ".claude" \
            --exclude ".gemini" \
            --exclude ".vscode" \
            --exclude "tests" \
            --exclude "docs" \
            --exclude "AGENTS.md" \
            --exclude "README.md" \
            --exclude "CONTRIBUTING.md" \
            --exclude "CODE_OF_CONDUCT.md" \
            --exclude ".editorconfig" \
            --exclude ".gitignore" \
            --exclude "src/install" \
            -e "ssh -p ${{ secrets.STAGING_PORT }}" \
            ./ \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:~/deploy/panel-staging/releases/${{ env.RELEASE }}/

      - name: Prepare shared directories and activate release
        run: |
          ssh -p ${{ secrets.STAGING_PORT }} \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'

          set -e

          RELEASE="${{ env.RELEASE }}"
          DEPLOY=~/deploy/panel-staging

          mkdir -p "$DEPLOY/shared/src/data/cache"
          mkdir -p "$DEPLOY/shared/src/data/log"
          mkdir -p "$DEPLOY/shared/src/data/uploads"

          rm -rf "$DEPLOY/releases/$RELEASE/src/data/cache"
          rm -rf "$DEPLOY/releases/$RELEASE/src/data/log"
          rm -rf "$DEPLOY/releases/$RELEASE/src/data/uploads"

          ln -sfn \
            "$DEPLOY/shared/src/data/cache" \
            "$DEPLOY/releases/$RELEASE/src/data/cache"

          ln -sfn \
            "$DEPLOY/shared/src/data/log" \
            "$DEPLOY/releases/$RELEASE/src/data/log"

          ln -sfn \
            "$DEPLOY/shared/src/data/uploads" \
            "$DEPLOY/releases/$RELEASE/src/data/uploads"

          if [ -f "$DEPLOY/shared/src/config.php" ]; then
            rm -f "$DEPLOY/releases/$RELEASE/src/config.php"
            ln -sfn \
              "$DEPLOY/shared/src/config.php" \
              "$DEPLOY/releases/$RELEASE/src/config.php"
          fi

          # Persist generated huraga theme settings across releases
          HURAGA_DIR="$DEPLOY/shared/src/themes/huraga/config"
          HURAGA_FILE="$HURAGA_DIR/settings_data.json"
          mkdir -p "$HURAGA_DIR"

          if [ ! -f "$HURAGA_FILE" ]; then
            for r in $(ls -1 "$DEPLOY/releases" | sort -r); do
              if [ -f "$DEPLOY/releases/$r/src/themes/huraga/config/settings_data.json" ]; then
                cp "$DEPLOY/releases/$r/src/themes/huraga/config/settings_data.json" "$HURAGA_FILE"
                break
              fi
            done
          fi

          mkdir -p "$DEPLOY/releases/$RELEASE/src/themes/huraga/config"
          rm -f "$DEPLOY/releases/$RELEASE/src/themes/huraga/config/settings_data.json"
          ln -sfn "$HURAGA_FILE" \
            "$DEPLOY/releases/$RELEASE/src/themes/huraga/config/settings_data.json"

          ln -sfn \
            "$DEPLOY/releases/$RELEASE" \
            "$DEPLOY/current"

          # Purge shared cache so stale compiled Twig/Doctrine metadata and
          # autoload maps from previous code versions don't break the new release.
          find "$DEPLOY/shared/src/data/cache" -mindepth 1 -delete

          EOF
